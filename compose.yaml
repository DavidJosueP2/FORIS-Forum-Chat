name: messages-sonnar

services:
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PGHOST: app-db
      PGPORT: "5432"
      PGDATABASE: messages
      PGUSER: messages
      PGPASSWORD: ${PGPASSWORD:?Define PGPASSWORD en el archivo .env}
    depends_on:
      app-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  app-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: messages
      POSTGRES_USER: messages
      POSTGRES_PASSWORD: ${PGPASSWORD:?Define PGPASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - messages_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonar-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Define SONAR_DB_PASSWORD en el archivo .env}
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Define SONAR_DB_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 30

  scanner:
    image: sonarsource/sonar-scanner-cli:12.3.0.4285_8.1.0
    profiles: ["analysis"]
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    working_dir: /usr/src
    volumes:
      - .:/usr/src:ro
      - sonar_scanner_cache:/opt/sonar-scanner/.sonar/cache
    command:
      - -Dsonar.working.directory=/tmp/sonar-working
      - -Dsonar.qualitygate.wait=true
    restart: "no"

volumes:
  messages_postgres_data:
  sonar_postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_scanner_cache:
